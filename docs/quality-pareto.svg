<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 470" width="760" height="470" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title>Answer quality versus cost</title>
  <desc>Share of answers judged good enough against cost per 100 prompts for HybridRouter and fixed strategies. HybridRouter: 91% at $0.61; Always on-device: 62% at $0.00; Always Sonnet: 97% at $0.71; Always Opus: 100% at $1.51; Random, same mix: 84% at $0.45; Perfect routing: 99% at $0.42.</desc>
  <style>
    .bg { fill: #ffffff; }
    .grid { stroke: #eaeef2; stroke-width: 1; }
    .tick { fill: #59636e; font-size: 12px; }
    .axis { fill: #1f2328; font-size: 13px; font-weight: 600; }
    .name { fill: #1f2328; font-size: 13px; }
    .strong { font-weight: 700; }
    .detail { fill: #59636e; font-size: 12px; }
    .point { fill: #59636e; }
    .router { fill: #b04e2c; stroke: #ffffff; stroke-width: 2; }
    .oracle { fill: #ffffff; stroke: #007c80; stroke-width: 2; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .grid { stroke: #21262d; }
      .tick, .detail { fill: #9198a1; }
      .axis, .name { fill: #e6edf3; }
      .point { fill: #9198a1; }
      .router { fill: #e07b56; stroke: #0d1117; }
      .oracle { fill: #0d1117; stroke: #3fd0c8; }
    }
  </style>
  <rect class="bg" x="0" y="0" width="760" height="470"/>
  <line class="grid" x1="70.0" y1="380.0" x2="730.0" y2="380.0"/>
  <text class="tick" x="60.0" y="384.0" text-anchor="end">50%</text>
  <line class="grid" x1="70.0" y1="312.0" x2="730.0" y2="312.0"/>
  <text class="tick" x="60.0" y="316.0" text-anchor="end">60%</text>
  <line class="grid" x1="70.0" y1="244.0" x2="730.0" y2="244.0"/>
  <text class="tick" x="60.0" y="248.0" text-anchor="end">70%</text>
  <line class="grid" x1="70.0" y1="176.0" x2="730.0" y2="176.0"/>
  <text class="tick" x="60.0" y="180.0" text-anchor="end">80%</text>
  <line class="grid" x1="70.0" y1="108.0" x2="730.0" y2="108.0"/>
  <text class="tick" x="60.0" y="112.0" text-anchor="end">90%</text>
  <line class="grid" x1="70.0" y1="40.0" x2="730.0" y2="40.0"/>
  <text class="tick" x="60.0" y="44.0" text-anchor="end">100%</text>
  <line class="grid" x1="70.0" y1="40.0" x2="70.0" y2="380.0"/>
  <text class="tick" x="70.0" y="400.0" text-anchor="middle">$0.00</text>
  <line class="grid" x1="169.5" y1="40.0" x2="169.5" y2="380.0"/>
  <text class="tick" x="169.5" y="400.0" text-anchor="middle">$0.25</text>
  <line class="grid" x1="269.1" y1="40.0" x2="269.1" y2="380.0"/>
  <text class="tick" x="269.1" y="400.0" text-anchor="middle">$0.50</text>
  <line class="grid" x1="368.6" y1="40.0" x2="368.6" y2="380.0"/>
  <text class="tick" x="368.6" y="400.0" text-anchor="middle">$0.75</text>
  <line class="grid" x1="468.1" y1="40.0" x2="468.1" y2="380.0"/>
  <text class="tick" x="468.1" y="400.0" text-anchor="middle">$1.00</text>
  <line class="grid" x1="567.7" y1="40.0" x2="567.7" y2="380.0"/>
  <text class="tick" x="567.7" y="400.0" text-anchor="middle">$1.25</text>
  <line class="grid" x1="667.2" y1="40.0" x2="667.2" y2="380.0"/>
  <text class="tick" x="667.2" y="400.0" text-anchor="middle">$1.50</text>
  <text class="axis" x="400.0" y="426.0" text-anchor="middle">Cost per 100 prompts (USD)</text>
  <text class="axis" transform="translate(18 210.0) rotate(-90)" text-anchor="middle">Answers judged good enough</text>
  <circle class="router" cx="311.3" cy="98.9" r="9.0"/>
  <text class="name strong" x="325.3" y="96.9" text-anchor="start">HybridRouter</text>
  <text class="detail" x="325.3" y="111.9" text-anchor="start">91% · $0.61</text>
  <circle class="point" cx="70.0" cy="298.4" r="6.5"/>
  <text class="name" x="84.0" y="296.4" text-anchor="start">Always on-device</text>
  <text class="detail" x="84.0" y="311.4" text-anchor="start">62% · $0.00</text>
  <circle class="point" cx="351.2" cy="58.1" r="6.5"/>
  <text class="name" x="365.2" y="56.1" text-anchor="start">Always Sonnet</text>
  <text class="detail" x="365.2" y="71.1" text-anchor="start">97% · $0.71</text>
  <circle class="point" cx="670.0" cy="40.0" r="6.5"/>
  <text class="name" x="656.0" y="38.0" text-anchor="end">Always Opus</text>
  <text class="detail" x="656.0" y="53.0" text-anchor="end">100% · $1.51</text>
  <circle class="point" cx="248.1" cy="146.2" r="6.5"/>
  <text class="name" x="262.1" y="144.2" text-anchor="start">Random, same mix</text>
  <text class="detail" x="262.1" y="159.2" text-anchor="start">84% · $0.45</text>
  <circle class="oracle" cx="237.5" cy="49.1" r="6.5"/>
  <text class="name" x="223.5" y="47.1" text-anchor="end">Perfect routing</text>
  <text class="detail" x="223.5" y="62.1" text-anchor="end">99% · $0.42</text>
  <text class="detail" x="70.0" y="458.0">150 held-out prompts on an iPhone 17 Pro Max, each answered on every route and graded by Claude Opus 5.5.</text>
</svg>
