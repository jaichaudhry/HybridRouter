  <text class="detail" x="277.5" y="111.9" text-anchor="start">91% · $0.61</text>
  <circle class="point" cx="70.0" cy="298.4" r="6.5"/>
  <text class="name" x="84.0" y="296.4" text-anchor="start">Always on-device</text>
  <text class="detail" x="84.0" y="311.4" text-anchor="start">62% · $0.00</text>
  <circle class="point" cx="295.5" cy="58.1" r="6.5"/>
  <text class="name" x="309.5" y="56.1" text-anchor="start">Always Sonnet</text>
  <text class="detail" x="309.5" y="71.1" text-anchor="start">97% · $0.71</text>
  <circle class="point" cx="551.1" cy="40.0" r="6.5"/>
  <text class="name" x="537.1" y="38.0" text-anchor="end">Always Opus</text>
  <text class="detail" x="537.1" y="53.0" text-anchor="end">100% · $1.51</text>
  <circle class="point" cx="670.0" cy="53.6" r="6.5"/>
  <text class="name" x="656.0" y="78.6" text-anchor="end">Always Muse Wonder</text>
  <text class="detail" x="656.0" y="93.6" text-anchor="end">98% · $1.88</text>
  <circle class="point" cx="212.8" cy="146.2" r="6.5"/>
  <text class="name" x="226.8" y="144.2" text-anchor="start">Random, same mix</text>
  <text class="detail" x="226.8" y="159.2" text-anchor="start">84% · $0.45</text>
  <circle class="oracle" cx="204.3" cy="49.1" r="6.5"/>
  <text class="name" x="190.3" y="47.1" text-anchor="end">Perfect routing</text>
  <text class="detail" x="190.3" y="62.1" text-anchor="end">99% · $0.42</text>
  <text class="detail" x="70.0" y="458.0">150 held-out prompts on an iPhone 17 Pro Max, each answered on every route and graded by Claude Opus 5.5.</text>
