name: HybridRouter
options:
  bundleIdPrefix: dev.hybridrouter
  deploymentTarget:
    iOS: "27.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Debug.xcconfig
  Release: Config/Release.xcconfig
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  HybridRouterKit:
    path: Packages/HybridRouterKit
  ChatUI:
    path: Packages/ChatUI
targets:
  HybridRouter:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - AppIcon.icon
      # An Icon Composer document: one file to Xcode, not a folder of SVGs.
      - path: App/AppIcon.icon
        type: file
        buildPhase: resources
      - path: Evals/classifier_benchmark.json
        buildPhase: resources
      - path: Evals/quality_benchmark.json
        buildPhase: resources
      - path: Evals/quality_testset.json
        buildPhase: resources
      - path: Evals/multiturn_benchmark.json
        buildPhase: resources
      # The published 0.2.0 results, so the app can add Apple Cloud to them.
      - path: Evals/results/2026-10-14-iphone-quality-muse.json
        buildPhase: resources
      # The test set's saved answers, so a routing change can be confirmed on it by replay.
      - path: Evals/results/2026-10-15-iphone-quality-testset.json
        buildPhase: resources
    dependencies:
      - package: HybridRouterKit
        product: HybridRouterKit
      - package: HybridRouterKit
        product: HybridRouterKitVoice
      - package: ChatUI
        product: ChatUI
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: HybridRouter
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~iphone:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: Speak a message instead of typing it. Speech is transcribed on your device, and the audio never leaves it.
        NSSpeechRecognitionUsageDescription: Turn what you say into text on your device.
        NSCameraUsageDescription: Scan receipts and documents. Scans stay on your device or Apple's Private Cloud Compute and are never sent to Claude or Muse Wonder.
        HRAppleCloudEnabled: $(HR_APPLE_CLOUD_ENABLED)
        HRClaudeClientID: $(CLAUDE_CLIENT_ID)
        HRDeveloperAnthropicKey: $(ANTHROPIC_API_KEY)
        HRDeveloperMetaKey: $(META_API_KEY)
    settings:
      base:
        GENERATE_INFOPLIST_FILE: NO
        # App/AppIcon.icon, an Icon Composer document.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
schemes:
  HybridRouter:
    build:
      targets:
        HybridRouter: all
    run:
      config: Debug
    test:
      config: Debug
