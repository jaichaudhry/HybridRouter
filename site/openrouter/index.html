<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>Back to HybridRouter</title>
<style>
  :root { color-scheme: light dark; --bg: #ffffff; --fg: #1f2328; --muted: #59636e; --accent: #b04e2c; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; --muted: #9198a1; --accent: #e07a55; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
         background: var(--bg); color: var(--fg); font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
  main { max-width: 26rem; text-align: center; }
  h1 { font-size: 1.4rem; margin: 0 0 0.5rem; }
  p { color: var(--muted); margin: 0 0 1.25rem; }
  a.button { display: inline-block; padding: 0.7rem 1.4rem; border-radius: 999px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
</style>
</head>
<body>
<main>
  <h1 id="title">Returning to HybridRouter…</h1>
  <p id="detail">OpenRouter approved the sign-in. If the app doesn't open, tap below.</p>
  <a class="button" id="open" href="#">Open HybridRouter</a>
</main>
<script>
  // OpenRouter only calls back to https pages, so this page hands its one-time code to the app.
  // The code is useless without the verifier the app kept (PKCE). Only `code` and `state` are
  // forwarded, and nothing is stored or sent anywhere else.
  (function () {
    var query = new URLSearchParams(location.search);
    var forward = new URLSearchParams();
    ["code", "state"].forEach(function (name) {
      var value = query.get(name);
      if (value) forward.set(name, value);
    });
    var link = document.getElementById("open");
    if (!forward.has("code")) {
      document.getElementById("title").textContent = "Sign-in wasn't completed";
      document.getElementById("detail").textContent = "OpenRouter didn't send a sign-in code. Go back to HybridRouter and try again.";
      link.hidden = true;
      return;
    }
    var target = "hybridrouter://openrouter?" + forward.toString();
    link.href = target;
    location.replace(target);
  })();
</script>
</body>
</html>
